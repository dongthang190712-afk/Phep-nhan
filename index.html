<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toán Nhanh 360 - Luyện Phép Nhân Đúng / Sai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          animation: {
            'blob': 'blob 7s infinite',
            'shake': 'shake 0.45s cubic-bezier(.36,.07,.19,.97) both',
            'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            shake: {
              '10%, 90%': { transform: 'translate3d(-3px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(5px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-8px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(8px, 0, 0)' }
            },
            pop: {
              '0%': { transform: 'scale(0.85)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .grid-highlight {
      background-color: rgba(99, 102, 241, 0.25) !important;
      transform: scale(1.05);
    }
    .grid-active {
      background: linear-gradient(135deg, #6366f1, #ec4899) !important;
      color: white !important;
      transform: scale(1.12);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
      z-index: 10;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Nền gradient chuyển động -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-0 -left-4 w-80 h-80 bg-purple-400 dark:bg-purple-600/30 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-80 h-80 bg-cyan-400 dark:bg-cyan-600/30 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-80 h-80 bg-pink-400 dark:bg-pink-600/30 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
  </div>

  <!-- Thanh điều hướng -->
  <header class="max-w-5xl mx-auto px-4 pt-6 pb-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-indigo-500/30">
        ×
      </div>
      <div>
        <h1 class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-indigo-600 to-pink-500 dark:from-indigo-400 dark:to-pink-400 bg-clip-text text-transparent">
          Toán Nhanh 360
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Luyện phản xạ phép nhân Đúng / Sai</p>
      </div>
    </div>

    <!-- Chuyển tab -->
    <div class="flex items-center gap-2 glass-card p-1.5 rounded-2xl shadow-sm">
      <button onclick="switchTab('game')" id="tab-game" class="px-4 py-2 rounded-xl text-sm font-bold transition-all bg-indigo-600 text-white shadow-md">
        🎮 Đúng / Sai
      </button>
      <button onclick="switchTab('table')" id="tab-table" class="px-4 py-2 rounded-xl text-sm font-bold transition-all text-slate-600 dark:text-slate-300 hover:bg-white/50 dark:hover:bg-slate-800/50">
        📊 Bảng Cửu Chương
      </button>
    </div>

    <!-- Nút Âm thanh & Giao diện -->
    <div class="flex items-center gap-2">
      <button onclick="toggleSound()" id="btn-sound" title="Bật/Tắt âm thanh" class="glass-card w-10 h-10 rounded-xl flex items-center justify-center text-lg hover:scale-105 transition-transform shadow-sm">
        🔊
      </button>
      <button onclick="toggleTheme()" id="btn-theme" title="Chế độ Sáng/Tối" class="glass-card w-10 h-10 rounded-xl flex items-center justify-center text-lg hover:scale-105 transition-transform shadow-sm">
        ☀️
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pb-12">

    <!-- ==================== TAB 1: CHẾ ĐỘ ĐÚNG / SAI ==================== -->
    <section id="view-game" class="space-y-6">

      <!-- Chọn cấp độ -->
      <div class="glass-card p-3 rounded-2xl flex flex-wrap items-center justify-between gap-3 shadow-sm">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400 px-2">Cấp độ:</span>
          <button onclick="setDifficulty('easy')" data-diff="easy" class="diff-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow">Cơ bản (1-5)</button>
          <button onclick="setDifficulty('medium')" data-diff="medium" class="diff-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-200/70 dark:bg-slate-800/70 hover:bg-indigo-500/20">Chuẩn (1-10)</button>
          <button onclick="setDifficulty('hard')" data-diff="hard" class="diff-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-200/70 dark:bg-slate-800/70 hover:bg-indigo-500/20">Nâng cao (11-20)</button>
          <button onclick="setDifficulty('custom')" data-diff="custom" class="diff-btn px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-200/70 dark:bg-slate-800/70 hover:bg-indigo-500/20">Chọn bảng riêng</button>
        </div>

        <!-- Chọn bảng nhân riêng -->
        <div id="custom-table-selector" class="hidden flex items-center gap-2">
          <label class="text-xs font-semibold">Bảng nhân:</label>
          <select id="custom-num" onchange="resetAndStart()" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs font-bold">
            <option value="2">Bảng 2</option>
            <option value="3">Bảng 3</option>
            <option value="4">Bảng 4</option>
            <option value="5">Bảng 5</option>
            <option value="6">Bảng 6</option>
            <option value="7" selected>Bảng 7</option>
            <option value="8">Bảng 8</option>
            <option value="9">Bảng 9</option>
          </select>
        </div>
      </div>

      <!-- Bảng điểm & Chỉ số -->
      <div class="grid grid-cols-3 gap-3 sm:gap-4">
        <div class="glass-card p-4 rounded-2xl text-center shadow-sm">
          <div class="text-xs font-bold uppercase text-slate-400">Điểm số</div>
          <div id="score-val" class="text-2xl sm:text-3xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-1">0</div>
        </div>
        <div class="glass-card p-4 rounded-2xl text-center shadow-sm relative overflow-hidden">
          <div class="text-xs font-bold uppercase text-slate-400">Chuỗi Combo</div>
          <div id="combo-val" class="text-2xl sm:text-3xl font-extrabold text-amber-500 mt-1">0 🔥</div>
        </div>
        <div class="glass-card p-4 rounded-2xl text-center shadow-sm">
          <div class="text-xs font-bold uppercase text-slate-400">Kỷ lục</div>
          <div id="highscore-val" class="text-2xl sm:text-3xl font-extrabold text-emerald-500 mt-1">0</div>
        </div>
      </div>

      <!-- Khu vực hiển thị phép tính chính -->
      <div id="game-card" class="glass-card rounded-3xl p-6 sm:p-10 shadow-xl relative overflow-hidden transition-all duration-200 border-2 border-transparent">
        
        <!-- Thanh đếm ngược thời gian -->
        <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden mb-8">
          <div id="timer-bar" class="h-full bg-gradient-to-r from-emerald-400 via-amber-400 to-rose-500 w-full transition-all duration-75 ease-linear"></div>
        </div>

        <!-- Màn hình Bắt đầu / Kết thúc -->
        <div id="overlay-screen" class="text-center py-8 space-y-5">
          <div id="overlay-emoji" class="text-6xl animate-bounce">🚀</div>
          <h2 id="overlay-title" class="text-2xl sm:text-3xl font-extrabold">Sẵn sàng thử thách phản xạ?</h2>
          <p id="overlay-desc" class="text-slate-500 dark:text-slate-400 max-w-md mx-auto text-sm">
            Xác định nhanh phép nhân hiển thị là <b>ĐÚNG</b> hay <b>SAI</b> trước khi hết giờ. Dùng phím tắt <kbd class="px-2 py-0.5 bg-slate-200 dark:bg-slate-800 rounded text-xs font-mono">←</kbd> (Đúng) hoặc <kbd class="px-2 py-0.5 bg-slate-200 dark:bg-slate-800 rounded text-xs font-mono">→</kbd> (Sai).
          </p>
          <button onclick="startGame()" class="px-8 py-4 rounded-2xl bg-gradient-to
